# Anchors copied from ../resource-limits.yaml (only referenced)

# Resource size anchors
x-resource-medium: &resource_medium
  mem_limit: 512m
  mem_reservation: 128m
  cpus: 1.0
  pids_limit: 512

# Role-specific resource anchors
x-resource-service: &resource_service
  stop_grace_period: 30s
  oom_score_adj: 200

services:
  # Portainer: Docker management UI
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-latest}
    container_name: portainer
    command:
      - --http-enabled
    env_file:
      - ../.env.global
      - .env
    volumes:
      - ${PORTAINER_DATA_VOL}:/data
      # Direct socket: Portainer needs write access (the shared proxy is read-only)
      - /var/run/docker.sock:/var/run/docker.sock
      # Same-path mount so stacks can read host .env.secrets by absolute path
      - /srv/docker/stacks:/srv/docker/stacks:ro
    tmpfs:
      - /tmp
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Router (HTTPS only)
      - traefik.http.routers.portainer-ui.rule=Host(`portainer.home`)
      - traefik.http.routers.portainer-ui.entrypoints=websecure
      - traefik.http.routers.portainer-ui.tls=true
      - traefik.http.routers.portainer-ui.tls.certresolver=stepca
      - traefik.http.routers.portainer-ui.service=portainer-ui
      - traefik.http.services.portainer-ui.loadbalancer.server.port=9000
    security_opt:
      - no-new-privileges:true
    # cap_drop omitted: needs to read 600 .env.secrets files owned by the host user
    <<: [*resource_medium, *resource_service]

networks:
  proxy:
    external: true

# =============================================================================
# AI Studio egress proxy - allowlist only.
# Paperclip and every agent process reach the outside world only through this
# proxy (the paperclip container sits on internal-only networks). Anything not
# listed in allowlist.txt is refused, and so are raw IP destinations.
# Reload after editing allowlist.txt:  scripts/studio egress-reload
# =============================================================================
http_port 3128

acl allowed_dst dstdomain -n "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access deny all

# Pure forwarder: no caching, tiny memory footprint.
cache deny all
cache_mem 16 MB
maximum_object_size_in_memory 64 KB
memory_pools off
# Docker reports a huge nofile limit; squid would try to size tables for it.
max_filedescriptors 4096
# No ICMP pinger: it needs raw sockets (CAP_NET_RAW), which we drop.
pinger_enable off

# Privacy: don't forward the client address.
forwarded_for delete


# Logs: the image entrypoint tails /var/log/squid/*.log to the container log
# (docker logs ai-studio-egress-proxy-1). /var/log/squid is a tmpfs.
# CONNECT tunnels log host:port only, never URLs or payloads.
logformat studio %ts.%03tu %>a %Ss/%03>Hs %rm %ru %<a
access_log daemon:/var/log/squid/access.log studio
cache_log /var/log/squid/cache.log
cache_store_log none
# World-readable log files so the entrypoint's `tail -F` (root without
# CAP_DAC_OVERRIDE) can forward them to the container log.
umask 022
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
shutdown_lifetime 3 seconds

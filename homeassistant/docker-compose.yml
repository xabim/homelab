# =============================================================================
# Home Assistant - home automation (local control, no cloud)
#
# Mode:  always-on (automations must run whenever the host is up)
# URL:   https://ha.home
# Data:  /srv/docker/volumes/homeassistant/config (YAML, SQLite recorder, .storage)
# Notes: Bridge network, not host: devices are added by IP (no mDNS/SSDP discovery).
#        Traefik is a reverse proxy, so configuration.yaml needs `http:` with
#        use_x_forwarded_for + trusted_proxies = the `proxy` network subnet.
# Deploy: Portainer Git stack from github.com/xabim/homelab (main)
# =============================================================================

# Anchors copied from ../resource-limits.yaml (only referenced)

# Resource size anchors
x-resource-large: &resource_large
  mem_limit: 1g
  mem_reservation: 256m
  cpus: 2.0
  pids_limit: 1024

# Role-specific resource anchors
x-resource-service: &resource_service
  stop_grace_period: 30s
  oom_score_adj: 200

services:
  # Home Assistant Core
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}
    container_name: homeassistant
    env_file:
      - ../.env.global
      - .env
      - /srv/docker/stacks/homeassistant/.env.secrets
    volumes:
      - ${HA_CONFIG_DIR}:/config
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true

      # Router (HTTPS only)
      - traefik.http.routers.homeassistant.rule=Host(`ha.home`)
      - traefik.http.routers.homeassistant.entrypoints=websecure
      - traefik.http.routers.homeassistant.tls=true
      - traefik.http.routers.homeassistant.tls.certresolver=stepca
      - traefik.http.services.homeassistant.loadbalancer.server.port=8123
    security_opt:
      - no-new-privileges:true
    <<: [*resource_large, *resource_service]

networks:
  proxy:
    external: true

# Anchors copied from ../resource-limits.yaml (only referenced)

# Resource size anchors
x-resource-small: &resource_small
  mem_limit: 256m
  mem_reservation: 64m
  cpus: 0.5
  pids_limit: 256

x-resource-medium: &resource_medium
  mem_limit: 512m
  mem_reservation: 128m
  cpus: 1.0
  pids_limit: 512

x-resource-large: &resource_large
  mem_limit: 1g
  mem_reservation: 256m
  cpus: 2.0
  pids_limit: 1024

# Role-specific resource anchors
x-resource-db: &resource_db
  stop_grace_period: 60s
  oom_score_adj: -100

x-resource-service: &resource_service
  stop_grace_period: 30s
  oom_score_adj: 200

services:
  # Forgejo: self-hosted Git service
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    env_file:
      - ../.env.global
      - .env
      - .env.secrets
    volumes:
      - ${FORGEJO_DATA_DIR}:/data
    networks:
      - proxy
      - forgejo_internal
    depends_on:
      - db
    restart: unless-stopped
    labels:
      - traefik.enable=true

      # Router (HTTPS only)
      - traefik.http.routers.forgejo.rule=Host(`forgejo.home`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.routers.forgejo.tls.certresolver=stepca
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
    security_opt:
      - no-new-privileges:true
    # Note: cap_drop intentionally omitted due to compatibility issues
    <<: [*resource_medium, *resource_service]

  # PostgreSQL database for Forgejo
  db:
    image: postgres:18-alpine
    env_file:
      - ../.env.global
      - .env
      - .env.secrets
    volumes:
      - ${FORGEJO_DB_VOL}:/var/lib/postgresql
    networks:
      - forgejo_internal
    restart: unless-stopped
    <<: [*resource_large, *resource_db]

networks:
  proxy:
    external: true
  forgejo_internal:
    driver: bridge

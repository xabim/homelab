# Anchors copied from ../resource-limits.yaml (only referenced)

# Resource size anchors
x-resource-medium: &resource_medium
  mem_limit: 512m
  mem_reservation: 128m
  cpus: 1.0
  pids_limit: 512

# Role-specific resource anchors
x-resource-service: &resource_service
  stop_grace_period: 30s
  oom_score_adj: 200

services:
  # Uptime Kuma: self-hosted monitoring tool
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION:-latest}
    container_name: uptime-kuma
    env_file:
      - ../.env.global
      - .env
      - /srv/docker/stacks/uptime-kuma/.env.secrets
    volumes:
      - ${UPTIME_KUMA_DATA_VOL}:/app/data
      # Mount CA certificate for monitoring HTTPS services
      - ${STEP_CA_ROOT_CA}:/etc/ssl/step/root_ca.crt:ro
    tmpfs:
      - /tmp
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Router (HTTPS only)
      - traefik.http.routers.status.rule=Host(`status.home`)
      - traefik.http.routers.status.entrypoints=websecure
      - traefik.http.routers.status.tls=true
      - traefik.http.routers.status.tls.certresolver=stepca
      - traefik.http.routers.status.service=status-svc
      - traefik.http.services.status-svc.loadbalancer.server.port=3001
    security_opt:
      - no-new-privileges:true
    <<: [*resource_medium, *resource_service]


networks:
  proxy:
    external: true

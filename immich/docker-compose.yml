# Anchors copied from ../resource-limits.yaml (only referenced)

# Resource size anchors
x-resource-small: &resource_small
  mem_limit: 256m
  mem_reservation: 64m
  cpus: 0.5
  pids_limit: 256

x-resource-medium: &resource_medium
  mem_limit: 512m
  mem_reservation: 128m
  cpus: 1.0
  pids_limit: 512

x-resource-large: &resource_large
  mem_limit: 1g
  mem_reservation: 256m
  cpus: 2.0
  pids_limit: 1024

x-resource-xlarge: &resource_xlarge
  mem_limit: 2g
  mem_reservation: 512m
  cpus: 4.0
  pids_limit: 2048

x-resource-xxlarge: &resource_xxlarge
  mem_limit: 4g
  mem_reservation: 1g
  cpus: 6.0
  pids_limit: 4096

# Role-specific resource anchors
x-resource-cache: &resource_cache
  stop_grace_period: 20s
  oom_score_adj: -200

x-resource-db: &resource_db
  stop_grace_period: 60s
  oom_score_adj: -100

x-resource-service: &resource_service
  stop_grace_period: 30s
  oom_score_adj: 200

name: immich

services:
  # Main Immich application server
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    <<: [*resource_xlarge, *resource_service]
    depends_on:
      immich-redis:
        condition: service_started
      immich-database:
        condition: service_healthy
    cpu_shares: 256
    blkio_config:
      weight: 100
    env_file:
      - ../.env.global
      - .env
      - .env.secrets
    environment:
      DB_HOSTNAME: immich-database
      DB_PORT: 5432
      REDIS_HOSTNAME: immich-redis
      IMMICH_PUBLIC_URL: https://immich.home
    volumes:
      # Immich library: uploads, thumbnails, etc.
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - ${IMMICH_DATA_DIR}:/data
    networks:
      - proxy
      - immich
    security_opt:
      - no-new-privileges:true

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Router (HTTPS only)
      - traefik.http.routers.immich.rule=Host(`immich.home`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls=true
      - traefik.http.routers.immich.tls.certresolver=stepca
      - traefik.http.services.immich.loadbalancer.server.port=2283

  # Machine learning service for face recognition, object detection
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-ml
    restart: unless-stopped
    <<: [*resource_medium, *resource_service]
    env_file:
      - ../.env.global
      - .env
    volumes:
      - ${IMMICH_ML_CACHE_VOL}:/cache
    networks:
      - immich
      - immich-egress
    security_opt:
      - no-new-privileges:true

  # Redis for caching and job queues
  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    <<: [*resource_small, *resource_cache]
    # Disable persistence: cache only
    command: redis-server --save "" --appendonly no
    networks:
      - immich
    security_opt:
      - no-new-privileges:true

  # PostgreSQL with pgvector and VectorChord extensions for AI features
  immich-database:
    env_file:
      - ../.env.global
      - .env
      - .env.secrets
    # Using Immich's recommended image with vector extensions
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    <<: [*resource_medium, *resource_db]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    blkio_config:
      weight: 200
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
  immich:
    internal: true
  immich-egress:
    driver: bridge

# Anchors copied from ../resource-limits.yaml (only referenced)

# Resource size anchors
x-resource-small: &resource_small
  mem_limit: 256m
  mem_reservation: 64m
  cpus: 0.5
  pids_limit: 256

# Role-specific resource anchors
x-resource-core: &resource_core
  stop_grace_period: 60s
  oom_score_adj: -400

services:
  # Step CA: internal certificate authority
  step-ca:
    image: smallstep/step-ca:${STEP_CA_VERSION:-latest}
    container_name: step-ca
    env_file:
      - ../.env.global
      - .env
    ports:
      - "9000:9000"
    volumes:
      - ${STEP_CA_VOL}:/home/step
    networks:
      proxy:
        # Network alias for certificate requests
        aliases:
          - ca.home
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    <<: [*resource_small, *resource_core]

networks:
  proxy:
    external: true
